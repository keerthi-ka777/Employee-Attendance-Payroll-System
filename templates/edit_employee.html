<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>Employee Management System</h2>

    <div>

        <a href="/">Dashboard</a>

        <a href="/employees">Employees</a>

        <a href="/attendance">Attendance</a>

        <a href="/payroll">Payroll</a>

    </div>

</nav>


<div class="container">

    <h1>Edit Employee</h1>


    <div class="form-card">

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ employee['name'] }}"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ employee['email'] }}"
                required
            >


            <label>Department</label>

            <input
                type="text"
                name="department"
                value="{{ employee['department'] }}"
                required
            >


            <label>Designation</label>

            <input
                type="text"
                name="designation"
                value="{{ employee['designation'] }}"
                required
            >


            <label>Joining Date</label>

            <input
                type="date"
                name="joining_date"
                value="{{ employee['joining_date'] }}"
                required
            >


            <label>Basic Salary</label>

            <input
                type="number"
                name="basic_salary"
                value="{{ employee['basic_salary'] }}"
                min="0"
                required
            >


            <button type="submit">
                Update Employee
            </button>

            <a href="/employees">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>

</html>
